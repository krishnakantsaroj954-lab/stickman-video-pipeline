name: Generate Stickman Entertainment Short

on:
  pull_request:
  workflow_dispatch:
    inputs:
      topic:
        description: "Funny or relatable topic for the Short"
        required: true
        default: "Mummy ke saamne phone chalaate hue pakde jaana"
        type: string

permissions:
  contents: read

concurrency:
  group: stickman-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install rendering dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Verify FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Generate entertainment Short
        env:
          TOPIC: "${{ inputs.topic || 'Mummy ke saamne phone chalaate hue pakde jaana' }}"
        run: python scripts/generate_video.py --topic "$TOPIC"

      - name: Run real MP4 quality gate
        run: python scripts/quality_check.py build/stickman-video.mp4

      - name: Validate MP4
        run: |
          test -s build/stickman-video.mp4
          ffprobe -v error             -show_entries format=duration             -show_entries stream=codec_name,width,height             -of default=noprint_wrappers=1             build/stickman-video.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: stickman-short
          path: build/stickman-video.mp4
          if-no-files-found: error
          retention-days: 7
