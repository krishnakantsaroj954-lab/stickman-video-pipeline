name: Generate Stickman Entertainment Short

on:
  pull_request:
  workflow_dispatch:
    inputs:
      topic:
        description: "Funny or relatable topic for the Short"
        required: true
        default: "Mummy ke saamne phone chalaate hue pakde jaana"
        type: string

permissions:
  contents: read

concurrency:
  group: stickman-video-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install rendering dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Verify toolchain
        run: |
          ffmpeg -version
          ffprobe -version
          python -m py_compile scripts/generate_video.py scripts/quality_check.py

      - name: Generate Phase 2 entertainment Short
        env:
          TOPIC: "\${{ inputs.topic || 'Mummy ke saamne phone chalaate hue pakde jaana' }}"
        run: python scripts/generate_video.py --topic "$TOPIC"

      - name: Run real MP4 quality gate
        run: python scripts/quality_check.py build/stickman-video.mp4

      - name: Upload rendered Short and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: stickman-short-phase2
          path: |
            build/stickman-video.mp4
            build/story.json
            quality-report.json
          if-no-files-found: error
          retention-days: 7
