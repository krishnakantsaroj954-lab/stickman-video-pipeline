name: Verticals v3 check + real stickman Short

on:
  pull_request:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic for the real Short"
        required: true
        default: "Mummy ke saamne phone chalaate hue pakde jaana"
        type: string

permissions:
  contents: read

jobs:
  check-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout stickman pipeline
        uses: actions/checkout@v4

      - name: Clone Verticals v3
        run: |
          git clone --depth 1 https://github.com/rushindrasinha/youtube-shorts-pipeline.git /tmp/verticals
          test -f /tmp/verticals/LICENSE
          test -f /tmp/verticals/verticals/assemble.py
          test -f /tmp/verticals/verticals/tts.py
          test -f /tmp/verticals/verticals/captions.py

      - name: Check Verticals source
        run: |
          python -m compileall -q /tmp/verticals/verticals
          echo "Verticals v3 source check: PASS"
          grep -n "MIT" /tmp/verticals/LICENSE | head -1 || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install stickman renderer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Render real Short
        env:
          TOPIC: "${{ inputs.topic }}"
        run: python scripts/generate_video.py --topic "$TOPIC"

      - name: Quality gate
        run: |
          python scripts/quality_check.py build/stickman-video.mp4
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 build/stickman-video.mp4

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: verticals-stickman-short
          path: build/stickman-video.mp4
          if-no-files-found: error
          retention-days: 7
